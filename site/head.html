<title>Danish Livestock Since 1920</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#f2f3ef;
  --surface:#fbfcfa;
  --ink:#10120f;
  --ink-2:#4e534c;
  --muted:#7d8279;
  --grid:#e3e5dd;
  --axis:#c4c8bb;
  --rule:rgba(16,18,15,0.12);
  --rule-soft:rgba(16,18,15,0.07);
  --s1:#2a78d6;
  --s2:#eb6834;
  --s3:#1baf7a;
  --s1-fill:rgba(42,120,214,0.13);
  --focus:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0e100e;
    --surface:#181a19;
    --ink:#ffffff;
    --ink-2:#c3c6bb;
    --muted:#8b9086;
    --grid:#2b2e2b;
    --axis:#3d413c;
    --rule:rgba(255,255,255,0.14);
    --rule-soft:rgba(255,255,255,0.07);
    --s1:#3987e5;
    --s2:#d95926;
    --s3:#199e70;
    --s1-fill:rgba(57,135,229,0.16);
    --focus:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0e100e;
  --surface:#181a19;
  --ink:#ffffff;
  --ink-2:#c3c6bb;
  --muted:#8b9086;
  --grid:#2b2e2b;
  --axis:#3d413c;
  --rule:rgba(255,255,255,0.14);
  --rule-soft:rgba(255,255,255,0.07);
  --s1:#3987e5;
  --s2:#d95926;
  --s3:#199e70;
  --s1-fill:rgba(57,135,229,0.16);
  --focus:#3987e5;
}

*{box-sizing:border-box;}
body{
  background:var(--plane);
  color:var(--ink);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1060px;margin:0 auto;padding:0 28px 96px;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px;}

/* ---------- type roles ---------- */
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);
}
h1,h2,h3,.stat-v,.hdr-v{font-family:"Archivo Narrow","Arial Narrow",Arial,sans-serif;}
h1{
  font-size:clamp(40px,7.2vw,72px);
  font-weight:700;line-height:0.98;letter-spacing:-0.015em;
  margin:14px 0 0;text-wrap:balance;
}
h2{font-size:clamp(26px,3.4vw,34px);font-weight:600;line-height:1.08;margin:10px 0 0;letter-spacing:-0.01em;text-wrap:balance;}
h3{font-size:19px;font-weight:600;margin:0;letter-spacing:0;}
p{margin:14px 0 0;max-width:64ch;}
a{color:inherit;text-decoration-color:var(--axis);text-underline-offset:2px;}
a:hover{text-decoration-color:var(--s1);}

/* ---------- masthead ---------- */
header.top{padding:56px 0 30px;}
.rule{height:1px;background:var(--rule);border:0;margin:0;}
.standfirst{font-size:20px;line-height:1.55;color:var(--ink-2);max-width:60ch;}
.byline{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px 20px;}

/* ---------- key figures ---------- */
.figs{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  margin-top:34px;
}
.fig{padding:18px 20px 20px;border-left:1px solid var(--rule-soft);}
.fig:first-child{border-left:0;padding-left:0;}
.stat-v{font-size:34px;font-weight:600;line-height:1;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
.fig .lab{font-size:13px;color:var(--ink-2);margin-top:7px;line-height:1.35;}
.fig .sub{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.02em;}

/* ---------- sections ---------- */
section{padding-top:56px;}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:12px;}
.sec-head .period{white-space:nowrap;}

/* ---------- small multiples ---------- */
.panels{
  display:grid;gap:0;
  grid-template-columns:repeat(auto-fill,minmax(238px,1fr));
  margin-top:26px;
  border-top:1px solid var(--rule-soft);
  border-left:1px solid var(--rule-soft);
}
.panel{
  background:var(--surface);padding:14px 14px 8px;position:relative;
  border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft);
}
.p-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.p-year{font-size:11px;color:var(--muted);letter-spacing:.06em;}
.p-mid{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px;}
.hdr-v{font-size:23px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;}
.p-peak{font-size:10.5px;color:var(--muted);text-align:right;line-height:1.3;}
.p-chart{margin-top:6px;}
.p-note{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px;padding-bottom:4px;font-family:"Source Serif 4",Georgia,serif;}
svg{display:block;overflow:visible;}

/* ---------- wide charts ---------- */
.chart-block{background:var(--surface);border:1px solid var(--rule-soft);margin-top:26px;padding:20px 20px 14px;position:relative;}
.chart-cap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px;}
.chart-cap h3{font-size:17px;}
.chart-cap .unit{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);}
.swatch{width:14px;height:3px;border-radius:2px;display:inline-block;}
.tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .09s;
  background:var(--surface);border:1px solid var(--rule);
  padding:8px 10px;font-size:12px;line-height:1.45;
  box-shadow:0 4px 14px rgba(0,0,0,.10);z-index:5;min-width:118px;
}
.tip .ty{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:4px;}
.tip .tr{display:flex;justify-content:space-between;gap:14px;color:var(--ink-2);}
.tip .tr b{color:var(--ink);font-weight:500;}

/* ---------- farm concentration rows ---------- */
.rows{margin-top:26px;border-top:1px solid var(--rule);}
.row{
  display:grid;grid-template-columns:130px 1fr 82px 82px 106px;
  gap:16px;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--rule-soft);
}
.row .name{font-size:14.5px;line-height:1.25;}
.row .name em{display:block;font-style:normal;font-size:11px;color:var(--muted);letter-spacing:.02em;}
.row .num{text-align:right;font-size:14px;font-variant-numeric:tabular-nums;}
.row .num em,.row .chg em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
.row .chg{text-align:right;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.rows-head{display:grid;grid-template-columns:130px 1fr 82px 82px 106px;gap:16px;padding:0 0 8px;}
.rows-head div{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.rows-head .r{text-align:right;}
@media (max-width:640px){
  .row,.rows-head{grid-template-columns:1fr 74px 74px;}
  .row .spark,.rows-head .sparkh{display:none;}
}

/* ---------- data table ---------- */
.tablewrap{margin-top:24px;border:1px solid var(--rule-soft);background:var(--surface);max-height:440px;overflow:auto;}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{padding:6px 12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
th{
  position:sticky;top:0;background:var(--surface);
  font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--rule);z-index:2;
}
td{font-family:"IBM Plex Mono",monospace;color:var(--ink-2);border-bottom:1px solid var(--rule-soft);}
thead th:first-child{text-align:left;}
tbody th{
  position:static;text-align:left;color:var(--ink);font-weight:400;font-size:13px;
  letter-spacing:0;text-transform:none;border-bottom:1px solid var(--rule-soft);
  font-family:"IBM Plex Mono",monospace;
}
tbody tr:hover td{background:var(--s1-fill);}

/* ---------- notes ---------- */
.notes{margin-top:22px;display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));}
.note{padding:16px 20px 18px;border-top:1px solid var(--rule-soft);}
.note h3{font-size:13px;letter-spacing:.02em;margin-bottom:4px;}
.note p{font-size:14px;line-height:1.5;margin:0;color:var(--ink-2);}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted);}
footer a{color:var(--ink-2);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
