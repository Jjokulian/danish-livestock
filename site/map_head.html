<title>Every Livestock Farm in Denmark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* ---------- tokens (same system as the 1920-2025 report) ---------- */
:root{
  color-scheme: light;
  --plane:#f2f3ef;
  --surface:#fbfcfa;
  --sea:#e8ebe6;
  --land:#f7f8f4;
  --ink:#10120f;
  --ink-2:#4e534c;
  --muted:#7d8279;
  --rule:rgba(16,18,15,0.12);
  --rule-soft:rgba(16,18,15,0.07);
  --coast:#c9cec3;
  --s1:#2a78d6;
  --s2:#eb6834;
  --s3:#1baf7a;
  --s0:#6b7268;
  --parcel-fill:rgba(16,18,15,0.045);
  --parcel-fill-strong:rgba(16,18,15,0.11);
  --parcel-line:rgba(16,18,15,0.34);
  --selected:#eb6834;
  --focus:#2a78d6;
  --shadow:0 6px 20px rgba(16,18,15,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0e100e; --surface:#181a19; --sea:#111312; --land:#1e211f;
    --ink:#ffffff; --ink-2:#c3c6bb; --muted:#8b9086;
    --rule:rgba(255,255,255,0.14); --rule-soft:rgba(255,255,255,0.07);
    --coast:#3d423c;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s0:#8b9386;
    --parcel-fill:rgba(255,255,255,0.05);
    --parcel-fill-strong:rgba(255,255,255,0.115);
    --parcel-line:rgba(255,255,255,0.36);
    --selected:#d95926;
    --focus:#3987e5; --shadow:0 6px 20px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0e100e; --surface:#181a19; --sea:#111312; --land:#1e211f;
  --ink:#ffffff; --ink-2:#c3c6bb; --muted:#8b9086;
  --rule:rgba(255,255,255,0.14); --rule-soft:rgba(255,255,255,0.07);
  --coast:#3d423c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s0:#8b9386;
  --parcel-fill:rgba(255,255,255,0.05);
  --parcel-fill-strong:rgba(255,255,255,0.115);
  --parcel-line:rgba(255,255,255,0.36);
  --selected:#d95926;
  --focus:#3987e5; --shadow:0 6px 20px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--plane);color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3,.big{font-family:"Archivo Narrow","Arial Narrow",Arial,sans-serif;}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100dvh;}
.bar{
  display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--surface);
  flex:0 0 auto;
}
.bar h1{font-size:23px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1;}
.bar .sub{font-size:13px;color:var(--ink-2);}
.bar .spacer{flex:1 1 auto;}
.main{flex:1 1 auto;display:flex;min-height:0;position:relative;}
.side{
  flex:0 0 296px;overflow-y:auto;background:var(--surface);
  border-right:1px solid var(--rule);padding:0 0 24px;
}
#map{flex:1 1 auto;background:var(--sea);min-width:0;}

/* ---------- sidebar blocks ---------- */
.blk{padding:16px 18px;border-bottom:1px solid var(--rule-soft);}
.blk > .eyebrow{display:block;margin-bottom:10px;}

.species{display:flex;flex-direction:column;gap:1px;}
.sp{
  display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;
  padding:6px 8px;border:0;background:none;color:var(--ink);cursor:pointer;
  font:inherit;text-align:left;border-radius:3px;width:100%;
}
.sp:hover{background:var(--rule-soft);}
.sp[aria-pressed="true"]{background:var(--rule-soft);box-shadow:inset 2px 0 0 var(--ink);}
.sp .chip{width:11px;height:11px;border-radius:50%;}
.sp .nm{font-size:14px;}
.sp .ct{font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;}

.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;}
.seg button{
  flex:1;padding:7px 6px;border:0;background:var(--surface);color:var(--ink-2);
  font:inherit;font-size:12.5px;cursor:pointer;border-left:1px solid var(--rule-soft);
}
.seg button:first-child{border-left:0;}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);}

.slider{width:100%;margin:6px 0 2px;accent-color:var(--s1);}
.slabel{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;}
.stat .big{font-size:22px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;}
.stat .lb{font-size:11px;color:var(--muted);letter-spacing:.02em;margin-top:2px;line-height:1.3;}

.komlist{display:flex;flex-direction:column;gap:1px;}
.kom{
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  padding:5px 8px;border:0;background:none;font:inherit;color:var(--ink);
  cursor:pointer;text-align:left;position:relative;border-radius:3px;width:100%;
}
.kom:hover{background:var(--rule-soft);}
.kom .barfill{position:absolute;left:0;top:0;bottom:0;background:var(--s1);opacity:.13;
  border-radius:3px;pointer-events:none;}
.kom span{position:relative;font-size:13px;}
.kom .v{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;}

.note{font-size:12px;color:var(--muted);line-height:1.45;}
.note a{color:var(--ink-2);}

/* ---------- legend over the map ---------- */
.legend{
  background:var(--surface);border:1px solid var(--rule);padding:10px 13px 11px;
  box-shadow:var(--shadow);margin:0 0 22px 14px;
}
.legend .eyebrow{display:block;margin-bottom:7px;}
.sizes{display:flex;align-items:flex-end;gap:12px;}
.sizes .sz{display:flex;flex-direction:column;align-items:center;gap:4px;}
.sizes .dot{border-radius:50%;background:var(--s1);opacity:.62;}
.sizes .cap{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);}
.legend .lod{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  margin-top:9px;padding-top:8px;border-top:1px solid var(--rule-soft);}

/* ---------- info panel ---------- */
.panel{
  position:absolute;top:0;right:0;bottom:0;width:330px;z-index:700;
  background:var(--surface);border-left:1px solid var(--rule);
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .18s ease;
}
.panel.open{transform:none;}
.panel header{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:15px 16px 12px;border-bottom:1px solid var(--rule);flex:0 0 auto;
}
.panel h3{font-size:20px;font-weight:600;line-height:1.1;margin:0;}
.panel .psub{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin-top:4px;}
.panel header button{
  border:0;background:none;color:var(--muted);font-size:22px;line-height:1;
  cursor:pointer;padding:0 2px;
}
.panel header button:hover{color:var(--ink);}
.pbody{overflow-y:auto;padding:4px 16px 22px;flex:1 1 auto;}
.pbody section{padding:13px 0 3px;border-bottom:1px solid var(--rule-soft);}
.pbody h4{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin:0 0 7px;font-weight:500;
}
.pr{display:flex;justify-content:space-between;gap:14px;font-size:13px;
  line-height:1.55;color:var(--ink-2);}
.pr b{font-weight:500;color:var(--ink);font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;text-align:right;}
.herd{padding:8px 0 9px;border-top:1px solid var(--rule-soft);}
.herd:first-of-type{border-top:0;padding-top:2px;}
.hh{font-family:"Archivo Narrow",Arial,sans-serif;font-size:15px;font-weight:600;}
.hs{font-size:11px;color:var(--muted);margin-bottom:4px;}
.pfoot{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:14px;}
@media (max-width:820px){
  .panel{width:auto;left:0;top:auto;height:62dvh;border-left:0;border-top:1px solid var(--rule);
    transform:translateY(100%);}
  .panel.open{transform:none;}
}

/* ---------- leaflet overrides ---------- */
.leaflet-container{background:var(--sea);font-family:"Source Serif 4",Georgia,serif;}
.leaflet-popup-content-wrapper{
  background:var(--surface);color:var(--ink);border-radius:3px;
  box-shadow:var(--shadow);border:1px solid var(--rule);
}
.leaflet-popup-tip{background:var(--surface);border:1px solid var(--rule);}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.5;min-width:190px;}
.leaflet-popup-close-button{color:var(--muted)!important;}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-bottom-color:var(--rule);}
.leaflet-bar a:hover{background:var(--plane);color:var(--ink);}
.leaflet-control-attribution{
  background:color-mix(in srgb,var(--surface) 88%,transparent)!important;
  color:var(--muted)!important;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
}
.leaflet-control-attribution a{color:var(--ink-2)!important;}
.leaflet-control-scale-line{
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  border-color:var(--coast);color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;font-size:10px;
}
.pop-h{font-family:"Archivo Narrow",Arial,sans-serif;font-size:17px;font-weight:600;
  line-height:1.15;margin-bottom:2px;}
.pop-sub{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;
  font-family:"IBM Plex Mono",monospace;margin-bottom:8px;}
.pop-row{display:flex;justify-content:space-between;gap:16px;}
.pop-row b{font-weight:500;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;}
.pop-sep{height:1px;background:var(--rule-soft);margin:7px 0;}
.pop-foot{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.4;}

@media (max-width:820px){
  body{overflow:auto;}
  .app{height:auto;}
  .main{flex-direction:column-reverse;}
  .side{flex:0 0 auto;border-right:0;border-top:1px solid var(--rule);}
  #map{height:62dvh;flex:0 0 auto;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
